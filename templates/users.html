{% extends 'base.html' %}{% block content %}<h2 class="section-title">Registered Users</h2><div class="table-card"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.user_id}}</td><td>{{u.full_name}}</td><td>{{u.email}}</td><td>{{u.phone}}</td><td>{{u.created_at}}</td></tr>{% else %}<tr><td colspan="5">No users.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
