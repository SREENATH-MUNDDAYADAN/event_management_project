{% extends 'base.html' %}{% block content %}<h2 class="section-title">Venue Network</h2><div class="form-card"><form method="post" class="row g-2"><div class="col-md-5"><input class="form-control" name="venue_a" placeholder="Venue A" required></div><div class="col-md-5"><input class="form-control" name="venue_b" placeholder="Connected Venue B" required></div><div class="col-md-2"><button class="btn btn-primary">Connect</button></div></form><p class="small text-muted mt-2">Connections are undirected. BFS is available to users in Phase 4.</p></div><div class="table-card mt-3"><h5>Known venues</h5>{% for v in venues %}<span class="badge bg-primary me-2 mb-2">{{v.venue_name}}</span>{% else %}<p>No venues yet.</p>{% endfor %}</div>{% endblock %}
