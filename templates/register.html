{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><div class="auth-card"><h2>Create Account</h2><form method="post"><label>Full name</label><input class="form-control mb-3" name="full_name" required><label>Email</label><input class="form-control mb-3" type="email" name="email" required><label>Phone</label><input class="form-control mb-3" name="phone"><label>Password</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><label>Confirm password</label><input class="form-control mb-3" type="password" name="confirm_password" required><button class="btn btn-primary w-100">Register</button></form><a href="{{ url_for('user_login') }}">Back to login</a></div></div>{% endblock %}
