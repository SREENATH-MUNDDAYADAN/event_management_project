{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><div class="auth-card"><h2>{{ 'Admin Login' if admin else 'User Login' }}</h2><p class="text-muted">Event Management System</p><form method="post"><label>Email</label><input class="form-control mb-3" type="email" name="email" required><label>Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Login</button></form>{% if not admin %}<p class="mt-3">New user? <a href="{{ url_for('register') }}">Register</a></p>{% endif %}<a href="{{ url_for('admin_login') if not admin else url_for('user_login') }}">{{ 'User login' if admin else 'Admin login' }}</a></div></div>{% endblock %}
