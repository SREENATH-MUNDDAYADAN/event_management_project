{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><div class="auth-card"><h2>Initial Admin Setup</h2><p class="text-muted">Create your first administrator account. Use a strong password.</p><form method="post"><label>Name</label><input class="form-control mb-3" name="name" required><label>Email</label><input class="form-control mb-3" type="email" name="email" required><label>Password (8+ characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><button class="btn btn-primary w-100">Create Admin</button></form></div></div>{% endblock %}
