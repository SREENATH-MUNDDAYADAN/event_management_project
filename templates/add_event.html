{% extends 'base.html' %}{% block content %}<h2 class="section-title">Submit an Event</h2><div class="form-card"><form method="post" class="row g-3"><div class="col-md-6"><label>Event Name *</label><input class="form-control" name="event_name" required></div><div class="col-md-6"><label>Category *</label><select class="form-select" name="category" required><option value="">Select category</option>{% for c in ['Music','Conference','Wedding','Food','Sports','College','Other'] %}<option>{{ c }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Date *</label><input class="form-control" type="date" name="event_date" required></div><div class="col-md-6"><label>Time</label><input class="form-control" type="time" name="event_time"></div><div class="col-md-6"><label>Venue *</label><input class="form-control" name="venue" required></div><div class="col-md-6"><label>Organizer</label><input class="form-control" name="organizer_name"></div><div class="col-md-6"><label>Contact number</label><input class="form-control" name="contact_number"></div><div class="col-md-6"><label>Expected participants</label><input class="form-control" type="number" min="0" name="expected_participants" value="0"></div><div class="col-12"><label>Description</label><textarea class="form-control" rows="4" name="description"></textarea></div><div class="col-12"><button class="btn btn-primary">Submit for Admin Approval</button></div></form><p class="small text-muted mt-3">Your event will remain Pending until an administrator reviews it.</p></div>{% endblock %}
